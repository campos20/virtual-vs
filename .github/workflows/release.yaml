name: Release Android APK

# Two ways in:
#
# 1. Tag push: `git tag v1.0.0-alpha.0 && git push origin v1.0.0-alpha.0`.
#    The tag must match the version in package.json, which is the single
#    source of truth - the build refuses to run otherwise rather than
#    shipping an APK whose version disagrees with the tag people downloaded
#    it from.
# 2. Manual dispatch: give it a version and the `prepare` job below does the
#    tag push above for you - bumps package.json, commits and pushes it to
#    main, then creates and pushes the tag - before handing off to the same
#    build job.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.2.0 or 1.2.0-alpha.1)'
        required: true
        type: string

permissions:
  contents: write # create the version-bump commit, tag and release
  actions: write # dispatch ci.yaml for the version-bump commit (see prepare job)
  id-token: write # sign the build provenance attestation
  attestations: write # record it against the repository

jobs:
  # Only runs for manual dispatch (the `if:` below) - a tag push arrives with
  # this already done by hand. Cuts from main's tip regardless of which
  # branch the dispatch form was opened against, so a release always starts
  # from a commit that's actually reachable from main.
  prepare:
    name: Bump version and tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate the requested version
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a valid semver version (expected e.g. 1.2.0 or 1.2.0-alpha.1)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bump package.json
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Commit, tag and push
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "Update version to ${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # The push above uses the default GITHUB_TOKEN, which by design does
      # not trigger other workflows' `push` triggers - otherwise a workflow
      # pushing a commit could recursively trigger itself. The `release`
      # job's "require a green CI run" step below still expects to find a
      # ci.yaml run for this commit, so ask for one explicitly. This is the
      # one documented exception to that rule: an explicit workflow_dispatch
      # call is allowed to start a run even from GITHUB_TOKEN.
      - name: Kick off CI for the version-bump commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yaml --ref "v${VERSION}"

  release:
    name: Build, sign and publish
    needs: [prepare]
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve the release commit
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the tag matches package.json
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package.json version ${PKG_VERSION}."
            echo "::error::Bump package.json (or retag) so the two agree, then push the tag again."
            exit 1
          fi
          echo "VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # CI (ci.yaml) already typechecks, lints and tests every push, so this
      # doesn't repeat that work. What it does check is that the tag actually
      # points at a commit which passed - nothing stops someone tagging a
      # commit that never reached main, or one whose CI went red.
      - name: Require a green CI run on a main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${RELEASE_SHA}" --jq '.status')"
          case "$STATUS" in
            identical|behind) ;;
            *)
              echo "::error::Tagged commit ${RELEASE_SHA} is not on main (compare status: ${STATUS})."
              echo "::error::Release from main so the commit has been through CI."
              exit 1
              ;;
          esac

          # A tag pushed straight after its commit can beat CI to the finish
          # - and the `prepare` job's explicit `gh workflow run` dispatch is
          # asynchronous too - so wait for a run to even exist, then for it
          # to finish, rather than failing a release that was about to be
          # fine.
          for _ in $(seq 1 40); do
            RUNS="$(gh run list --commit "$RELEASE_SHA" --workflow ci.yaml \
                      --json status,conclusion --limit 20)"
            TOTAL="$(echo "$RUNS" | jq 'length')"
            PENDING="$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')"
            [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ] && break
            echo "Waiting for CI run(s) on ${RELEASE_SHA} (found ${TOTAL}, ${PENDING} pending)..."
            sleep 15
          done

          FAILED="$(echo "$RUNS" | jq '[.[] | select(.conclusion != "success")] | length')"
          PASSED="$(echo "$RUNS" | jq '[.[] | select(.conclusion == "success")] | length')"
          if [ "$PASSED" -eq 0 ] || [ "$FAILED" -gt 0 ]; then
            echo "::error::No successful CI run for ${RELEASE_SHA}. Fix CI before tagging."
            echo "$RUNS"
            exit 1
          fi

      - name: Set the app version
        run: node scripts/sync-app-version.mjs "$VERSION" "$GITHUB_RUN_NUMBER"

      # Optional. What proves the APK belongs to this commit is the provenance
      # attestation further down, not the keystore. A release key only adds
      # one thing on top: a stable identity across versions, which is what
      # lets Android upgrade an install in place instead of making people
      # uninstall first. Without the secret the build still ships, using
      # Expo's default signing.
      - name: Restore the signing keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret - building with Expo's default signing."
            echo "SIGNED_WITH_RELEASE_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNED_WITH_RELEASE_KEY=true" >> "$GITHUB_ENV"

      - name: Generate the native project
        run: npx expo prebuild --platform android --clean --no-install

      # `:app:packageRelease` zips four ABIs' worth of native libraries on top
      # of everything prebuild, the NDK and Metro already wrote - the fullest
      # moment of the build, and the one that failed the v1.5.0/v1.5.1 releases
      # with nothing but "IncrementalSplitterRunnable failed". Both plausible
      # causes (no disk, or the packaging worker hitting the 2 GB heap the RN
      # template sets) report exactly that, so give it room for both and record
      # the numbers either way.
      - name: Make room for packaging
        run: |
          df -h /home/runner /
          free -m || true
          # Preinstalled toolchains this build never touches. Absolute paths
          # only - an unset variable here would expand to a path off the root.
          # Nothing listed is Node, Java or the Android SDK.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /home/runner /

      # android/ is generated by prebuild and not checked in, so the heap has
      # to be raised here rather than in a committed gradle.properties.
      #
      # The leading newline is load-bearing: prebuild writes the file with no
      # trailing newline, so a plain `echo >>` appends onto the last line
      # instead of after it. That silently corrupted
      # `expo.inlineModules.watchedDirectories` into `[]org.gradle.jvmargs=...`,
      # which Expo's autolinking then failed to parse - surfacing only as
      # "Process 'command 'node'' finished with non-zero exit value 1" during
      # configuration. A spare blank line costs nothing; a glued one costs a
      # whole release build.
      - name: Give Gradle a workable heap
        working-directory: android
        run: |
          printf '\n%s\n' "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "--- last lines of gradle.properties ---"
          tail -4 gradle.properties
          # Fail here, loudly, rather than 20 minutes into a build, if the
          # append ever lands on the wrong line again.
          grep -qx "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" gradle.properties
          grep -qx "expo.inlineModules.watchedDirectories=\[\]" gradle.properties

      - name: Build the release APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # --stacktrace is not noise here: `:app:packageRelease` reports its
          # real cause (out of space, OOM in a worker, a bad entry) only in the
          # stack trace, and without it a failed release costs another 25-minute
          # round trip just to find out what went wrong. Gradle's own output
          # tells you to pass it; do it up front instead.
          if [ "$SIGNED_WITH_RELEASE_KEY" = "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace \
              -PVIRTUALVS_STORE_FILE="$RUNNER_TEMP/release.jks" \
              -PVIRTUALVS_STORE_PASSWORD="$STORE_PASSWORD" \
              -PVIRTUALVS_KEY_ALIAS="$KEY_ALIAS" \
              -PVIRTUALVS_KEY_PASSWORD="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      # Same reasoning as the capacity probe above: if packaging died on space,
      # this is the number that proves it.
      - name: Report runner capacity after the build
        if: always()
        run: df -h /home/runner /

      - name: Stage the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/virtual-vs-${VERSION}.apk"

      # Records which key actually signed the APK, and fails only if a release
      # keystore was configured but didn't take effect - that would silently
      # break in-place upgrades for everyone who already installed.
      - name: Record the signing certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs --verbose "dist/virtual-vs-${VERSION}.apk" | tee signing.txt
          if [ "$SIGNED_WITH_RELEASE_KEY" = "true" ] && grep -qi 'CN=Android Debug' signing.txt; then
            echo "::error::A release keystore was provided but the APK is debug-signed - the signing plugin did not apply."
            exit 1
          fi
          FINGERPRINT="$(grep -i 'certificate SHA-256 digest' signing.txt | head -n 1 | awk '{print $NF}')"
          echo "FINGERPRINT=${FINGERPRINT}" >> "$GITHUB_ENV"

      - name: Checksum
        working-directory: dist
        run: sha256sum "virtual-vs-${VERSION}.apk" > SHA256SUMS.txt

      # Signed, transparency-logged proof that this exact APK was produced by
      # this workflow, from this repository, at this commit. Anyone can check
      # it with `gh attestation verify` - see the release notes.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/virtual-vs-${{ env.VERSION }}.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Install"
            echo
            echo "Download \`virtual-vs-${VERSION}.apk\` below and open it on your Android device."
            echo "You'll need to allow installing from your browser or file manager the first time."
            echo
            echo "## Verify this build before you install it"
            echo
            echo "You do not have to take my word for what is in this APK."
            echo
            echo "**1. Confirm GitHub built it, from this repo, at this commit:**"
            echo
            echo '```bash'
            echo "gh attestation verify virtual-vs-${VERSION}.apk --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "This checks a signature recorded in a public transparency log when the"
            echo "workflow ran. It proves the file came from [this workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "building commit \`${RELEASE_SHA}\` - not from someone reuploading a modified build."
            echo
            echo "**2. Confirm the file wasn't altered after upload:**"
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
            echo
            echo "**3. Signing certificate**"
            echo
            echo '```bash'
            echo "apksigner verify --print-certs virtual-vs-${VERSION}.apk"
            echo '```'
            echo
            echo "SHA-256 of the certificate that signed this APK:"
            echo
            echo '```'
            echo "${FINGERPRINT}"
            echo '```'
            if [ "$SIGNED_WITH_RELEASE_KEY" = "true" ]; then
              echo
              echo "This is the project's release key and is the same for every release, so"
              echo "an APK signed with a different certificate did not come from this project."
            else
              echo
              echo "> **Note:** this build was signed with a generated key rather than a stable"
              echo "> project release key, so this fingerprint may differ between releases and"
              echo "> Android may ask you to uninstall before updating. Step 1 above is the check"
              echo "> that actually ties this APK to its source commit."
            fi
          } > notes.md

          # --generate-notes appends GitHub's own "What's Changed" section
          # (the PRs merged since the last release) and a full-changelog
          # compare link after the hand-written notes above. --latest is set
          # explicitly rather than left to GitHub's date/semver heuristic,
          # so a prerelease never displaces the actual latest stable release
          # (or vice versa) on the repo's releases page.
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            $([ "${VERSION#*-}" != "$VERSION" ] && echo --prerelease) \
            $([ "${VERSION#*-}" != "$VERSION" ] && echo --latest=false || echo --latest) \
            "dist/virtual-vs-${VERSION}.apk" \
            "dist/SHA256SUMS.txt"
