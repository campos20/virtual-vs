name: CI

# Runs on open pull requests (each time one is opened, reopened or pushed to)
# and on pushes to main. A feature branch is checked once it has a PR, not on
# every push before that - and not twice per push once it does, which is what
# triggering on both `push` (every branch) and `pull_request` used to do.
#
# Pushes to main still run because release.yaml's "require a green CI run"
# gate looks for a successful run on the exact main commit being released,
# and a PR's run is on its merge ref, a different commit.
#
# Also dispatchable directly: release.yaml's workflow_dispatch path pushes
# the version-bump commit with the default GITHUB_TOKEN, which - by
# GitHub's own loop-prevention rule - does not trigger this workflow's
# `push` trigger. It explicitly dispatches this workflow instead so the
# release-time "require a green CI run" gate has something to find.
on:
  push:
    branches: [main]
    tags-ignore: ["**"] # release.yaml already runs the same checks for tags
  pull_request:
  workflow_dispatch:

# Superseded runs on the same branch are pointless once a newer commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx prettier --check .

      - name: Test
        run: npx jest --ci

      # Rendered onto the run itself rather than sent to a coverage service:
      # no third-party account, no token, and nothing else granted access to
      # the repository.
      - name: Publish coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      # The browsable HTML report, for digging into which lines are missed.
      - name: Upload the HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
